name: chess-64-squares-backend

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 restart chess-64-squares-backend --update-env || pm2 start dist/main.js --name chess-64-squares-backend
            pm2 save