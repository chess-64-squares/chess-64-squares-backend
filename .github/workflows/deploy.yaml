name: chess-64-squares-backend

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/chess-64-squares-backend

            git fetch origin
            git reset --hard origin/deploy

            npm ci --omit=dev
            npm run build

            pm2 restart chess-64-squares-backend --update-env \
              || pm2 start dist/main.js --name chess-64-squares-backend

            pm2 save

